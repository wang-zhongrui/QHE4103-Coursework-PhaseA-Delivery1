<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="login_and_registration_style.css">
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>AAAA - Registration</title> 

</head>

<body>
  <header>
    <div class="container navbar">
      <div class="logo-area">
        <img src="images/logo.png" alt="Company Logo">

        <div class="logo-text">
          <h1>AAAA</h1>
          <p>Authentic Automotive Assurance Avenue</p>
        </div> 
      </div>

      <nav>
        <a href="homepage.html">Home</a>
        <a href="registration.html">Registration</a>
        <a href="login.html">Login</a>
        <a href="addcar.html">Add Car</a>
        <a href="search.html">Search</a>
      </nav> 
    </div>
  </header>

  <section class="register-section">
    <div class="container">
      <div class="register-box">
        <h2>Seller Registration</h2>
        <p>Please complete the form below to create your seller account.</p>

        <form onsubmit="return checkRegistrationForm();">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">
          </div> 

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter your address">
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
          </div> 

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address">
          </div> 

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your desired username">
          </div> 

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your desired password">
          </div> 

          <button type="submit" class="register-button">Register</button> 

          <p class="login-link">
            Already have an account? <a href="login.html">Login here</a>
          </p> 
        </form>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
