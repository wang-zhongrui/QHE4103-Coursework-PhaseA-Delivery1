<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- 设置字符编码 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 适配不同屏幕 -->
  <title>AAAA - Registration</title> <!-- 浏览器标签页标题 -->

</head>

<body>
  <header>
    <div class="container navbar">
      <div class="logo-area">
        <img src="images/logo.png" alt="Company Logo">

        <div class="logo-text">
          <h1>AAAA</h1>
          <p>Authentic Automotive Assurance Avenue</p>
        </div> 
      </div>

      <nav>
        <a href="homepage delivery1.html">Home</a>
        <a href="register.html">Registration</a>
        <a href="login.html">Login</a>
        <a href="add-car.html">Add Car</a>
        <a href="search.html">Search</a>
      </nav> 
    </div>
  </header>

  <section class="register-section">
    <div class="container">
      <div class="register-box">
        <h2>Seller Registration</h2>
        <p>Please complete the form below to create your seller account.</p>

        <form>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" >
          </div> 

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" >
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" >
          </div> 

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email" >
          </div> 

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" >
          </div> 

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" >
          </div> 

          <button type="submit" class="register-button">Register</button> 

          <p class="login-link">
            Already have an account? <a href="login.html">Login here</a>
          </p> 
        </form>
      </div>
    </div>
  </section>
</body>
</html>
